name: Build, Sign, and Package DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
        description: "Create a signed GitHub Release and update Pages (main only)"

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.publish.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare_release.sh

      - name: Import Developer ID signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # ビルド用キーチェーン検索リストに追加し、codesignからアクセス可能にする
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            "$(security list-keychains -d user | sed 's/[\" ]//g' | head -n 1)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERTIFICATE_PATH"

      - name: Build, sign, notarize, and package DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./build_release.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Erabu-kun-dmg
          path: build/Erabu-kun.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        id: publish
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: "false"
          files: build/Erabu-kun.dmg
          fail_on_unmatched_files: "true"
          generate_release_notes: true

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  publish-pages:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    concurrency:
      group: release-pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Update release page and promote release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/publish_release_page.sh site
