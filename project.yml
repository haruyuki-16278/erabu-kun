name: Erabukun
options:
  bundleIdPrefix: net.relicsnow
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Erabu-kun
    SWIFT_VERSION: 5.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3N2Q57WT95
  configs:
    release:
      # Release構成では com.apple.security.get-task-allow を混入させない。
      # (Xcodeはデフォルトでデバッグ用エンタイトルメントを自動注入するが、
      # get-task-allow=true のままではApp Store提出時にリジェクトされる)
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Erabukun:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: src
        excludes:
          - "Info.plist"
          - "Erabukun.entitlements"
          - "Erabukun-DeveloperID.entitlements"
      - path: bar-icon.png
    settings:
      base:
        INFOPLIST_FILE: src/Info.plist
        CODE_SIGN_ENTITLEMENTS: src/Erabukun.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: net.relicsnow.erabukun
        GENERATE_INFOPLIST_FILE: NO
    postbuildScripts:
      - name: Set build number from git commit count
        script: |
          # CFBundleVersion (ビルド番号) を git のコミット数から自動設定する。
          # コード署名より前に、生成済み Info.plist を直接書き換える。
          BUILD_NUMBER=$(git -C "${SRCROOT}" rev-list --count HEAD)
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${PLIST}"
